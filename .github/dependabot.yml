version: 2
updates:
  # Pacotes NuGet (versões centralizadas no Directory.Packages.props)
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
      keycloak:
        patterns: ["Keycloak.*"]
      outros:
        patterns: ["*"]

  # Actions usadas nos workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
